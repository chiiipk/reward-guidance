[project]
name = "reward-guidance"
version = "0.1.0"
description = "Reward-guided flow matching experiments with FLUX second-order guidance"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "accelerate>=0.30",
    "diffusers>=0.30,<1",
    "image-reward",
    "matplotlib>=3.7",
    "numpy>=1.24",
    "openai-clip",
    "peft",
    "pillow>=10.0",
    "protobuf",
    "qwen-vl-utils",
    "scipy>=1.10",
    "sentencepiece",
    # openai-clip/ImageReward still imports pkg_resources, removed in setuptools 81+.
    "setuptools<81",
    "torch>=2.2",
    "torchvision",
    "tqdm>=4.65",
    "transformers>=4.49,<5",
]

[tool.uv]
package = false
